name: sarap_app
description: "SARAP - An AI-Assisted Restaurant Finder with Personalized Meal Planning"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  firebase_storage: ^12.3.4
  firebase_ai: ^2.0.0
  firebase_app_check: ^0.3.1
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.3
  pdf: ^3.13.1
  printing: ^5.15.1
  web: ^1.1.1
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon.jpg
    - assets/photos/

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon.jpg"